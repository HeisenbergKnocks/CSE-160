<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Draw a red vector (canvas version)</title>
    </head>
    <body onload="main()">
        <canvas id="example" width="400" height="400">
            Please use a browser that supports "canvas"
        </canvas>
        <div>
            <label for="x-coord">v1: x</label>
            <input type="text" id="x-coord" value="0" />
            <label for="y-coord">y</label>
            <input type="text" id="y-coord" value="5" />
            <br />
            <label for="x2-coord">v2: x</label>
            <input type="text" id="x2-coord" value="5" />
            <label for="y2-coord">y</label>
            <input type="text" id="y2-coord" value="0" />
            <input
                type="button"
                id="draw-button"
                value="Draw"
                onclick="handleDrawEvent()"
            />
            <br />
            <label for="operation">Operation:</label>
            <select id="operation">
                <option value="add">Add</option>
                <option value="sub">Subtract</option>
                <option value="mul">Multiply</option>
                <option value="div">Divide</option>
                <option value="magnitude">Magnitude</option>
                <option value="normalize">Normalize</option>
                <option value="angle">Angle between</option>
                <option value="area">Area</option>
            </select>
            <label for="scalar">Scalar:</label>
            <input type="text" id="scalar" value="" />
            <input
                type="button"
                id="operation-button"
                value="Draw"
                onclick="handleDrawOperationEvent()"
            />
        </div>
        <script src="lib/cuon-matrix-cse160.js"></script>
        <script src="asg0.js"></script>
    </body>
</html>
