<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Change a point color</title>
    </head>
    <body onload="main()">
        <!-- Row 1: Canvas -->
        <div style="margin-bottom: 10px">
            <canvas id="webgl" width="600" height="600">
                Please use a browser that supports "canvas"
            </canvas>
        </div>

        <!-- Row 2: Dot Counter -->
        <p id="numdot">XXX</p>

        <!-- Removed Clear and Drawing Mode Buttons -->

        <!-- Row 3: Color Sliders -->
        <div style="margin-bottom: 10px">
            <label for="redSlide">Red</label>
            <input
                type="range"
                min="0"
                max="100"
                value="100"
                class="slider"
                id="redSlide"
            />

            <label for="yellowSlide" style="margin-left: 20px">Yellow</label>
            <input
                type="range"
                min="-45"
                max="45"
                value="0"
                class="slider"
                id="yellowSlide"
            />

            <button type="button" id="animationYellowOnButton">ON</button>
            <button type="button" id="animationYellowOffButton">OFF</button>

            <label for="magentaSlide" style="margin-left: 20px">Magenta</label>
            <input
                type="range"
                min="-45"
                max="45"
                value="0"
                class="slider"
                id="magentaSlide"
            />

            <button type="button" id="animationMagentaOnButton">ON</button>
            <button type="button" id="animationMagentaOffButton">OFF</button>
        </div>

        <!-- Row 4: Camera Angle -->
        <div style="margin-bottom: 10px">
            <label for="angleSlide">Camera Angle</label>
            <input
                type="range"
                min="0"
                max="360"
                value="0"
                class="slider"
                id="angleSlide"
            />
        </div>

        <!-- Scripts -->
        <script src="../lib/webgl-utils.js"></script>
        <script src="../lib/webgl-debug.js"></script>
        <script src="../lib/cuon-utils.js"></script>
        <script src="../lib/cuon-matrix.js"></script>
        <script src="Triangle.js"></script>
        <script src="Cube.js"></script>
        <script src="Cylinder.js"></script>
        <script src="BlockyAnimal.js"></script>
    </body>
</html>
